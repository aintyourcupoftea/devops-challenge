# Demo-only credential for a local kind cluster. In a real environment this
# would come from a secret manager (Sealed Secrets / External Secrets / Vault)
# and never be committed in plaintext.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: devops-challenge
type: Opaque
stringData:
  POSTGRES_USER: appuser
  POSTGRES_PASSWORD: demo-password-change-me
  POSTGRES_DB: appdb
