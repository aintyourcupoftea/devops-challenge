name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "k8s/**"
      - ".github/workflows/ci-cd.yaml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/devops-challenge-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (for cross-arch build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          # GitHub-hosted runners are amd64, but the demo kind cluster runs
          # on Apple Silicon (arm64) - build both so the node can always pull.
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Apply base manifests
        run: kubectl apply -f k8s/

      - name: Roll out new image
        run: |
          kubectl -n devops-challenge set image deployment/backend \
            backend=${{ env.IMAGE }}:${{ needs.build-and-push.outputs.image_tag }}
          kubectl -n devops-challenge rollout status deployment/backend --timeout=120s

      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            if curl -sf http://localhost:30080/healthz/ready; then
              echo "Smoke test passed"
              exit 0
            fi
            sleep 3
          done
          echo "Smoke test failed" >&2
          exit 1
